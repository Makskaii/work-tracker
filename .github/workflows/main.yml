name: CI Build & Deploy

on:
  pull_request:
    branches: [main, master, develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linting with Biome
        run: npm run lint

      - name: Build project
        run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')

    steps:
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass jq

      - name: Prepare links
        run: |
          echo "RUN_URL=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_ENV"
          echo "COMMIT_URL=https://github.com/${{ github.repository }}/commit/${{ github.sha }}" >> "$GITHUB_ENV"
          echo "COMPARE_URL=https://github.com/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Run deploy on server
        id: deploy_step
        continue-on-error: true
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -o pipefail

          sshpass -p "$SERVER_PASSWORD" ssh \
            -o StrictHostKeyChecking=no \
            -p "${SERVER_PORT:-22}" \
            "$SERVER_USER@$SERVER_HOST" \
            "cd /home/bitrix/devapps/work-tracker && npm run deploy" \
            2>&1 | tee deploy.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo "DEPLOY_EXIT_CODE=$EXIT_CODE" >> "$GITHUB_ENV"

          {
            echo "DEPLOY_LOG<<EOF"
            tail -n 25 deploy.log
            echo "EOF"
          } >> "$GITHUB_ENV"

          exit "$EXIT_CODE"

      - name: Notify Bitrix on success
        if: steps.deploy_step.outcome == 'success'
        env:
          BITRIX_WEBHOOK: ${{ secrets.BITRIX_WEBHOOK }}
        run: |
          MESSAGE=$(cat <<EOF
          ✅ Деплой прошёл успешно

          📦 Репозиторий: ${{ github.repository }}
          🌿 Ветка: ${{ github.ref_name }}
          👤 Автор: ${{ github.actor }}

          🔗 Run: $RUN_URL
          🔗 Commit: $COMMIT_URL
          🔗 Changes: $COMPARE_URL
          EOF
          )

                    curl -s -X POST "$BITRIX_WEBHOOK" \
                      -H "Content-Type: application/json" \
                      -d "$(jq -n \
                        --arg dialog_id "chat3843" \
                        --arg message "$MESSAGE" \
                        '{DIALOG_ID: $dialog_id, MESSAGE: $message}')"

      - name: Notify Bitrix on failure
        if: steps.deploy_step.outcome == 'failure'
        env:
          BITRIX_WEBHOOK: ${{ secrets.BITRIX_WEBHOOK }}
        run: |
          MESSAGE=$(cat <<EOF
          ❌ Деплой завершился с ошибкой

          📦 Репозиторий: ${{ github.repository }}
          🌿 Ветка: ${{ github.ref_name }}
          👤 Автор: ${{ github.actor }}

          🔗 Run: $RUN_URL
          🔗 Commit: $COMMIT_URL
          🔗 Changes: $COMPARE_URL

          🧾 Последние строки лога:
          $DEPLOY_LOG
          EOF
          )

                    curl -s -X POST "$BITRIX_WEBHOOK" \
                      -H "Content-Type: application/json" \
                      -d "$(jq -n \
                        --arg dialog_id "chat3843" \
                        --arg message "$MESSAGE" \
                        '{DIALOG_ID: $dialog_id, MESSAGE: $message}')"

      - name: Fail job if deploy failed
        if: steps.deploy_step.outcome == 'failure'
        run: exit 1
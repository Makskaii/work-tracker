  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
    steps:
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Run deploy on server
        id: deploy_step
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -o pipefail
          if sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no -p "${SERVER_PORT:-22}" "$SERVER_USER@$SERVER_HOST" "cd /home/bitrix/devapps/work-tracker && npm run deploy"; then
            echo "DEPLOY_STATUS=success" >> $GITHUB_ENV
          else
            echo "DEPLOY_STATUS=failure" >> $GITHUB_ENV
            exit 1
          fi

      - name: Notify Bitrix on success
        if: env.DEPLOY_STATUS == 'success'
        env:
          BITRIX_WEBHOOK: ${{ secrets.BITRIX_WEBHOOK }}
        run: |
          curl -s -X POST "$BITRIX_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{
                  "DIALOG_ID": "chat3843",
                  "MESSAGE": "✅ Деплой прошёл успешно!\nБранч: '${{ github.ref_name }}'\nКоммит: '${{ github.sha }}'\nАвтор: '${{ github.actor }}'"
                }'

      - name: Notify Bitrix on failure
        if: failure()
        env:
          BITRIX_WEBHOOK: ${{ secrets.BITRIX_WEBHOOK }}
        run: |
          curl -s -X POST "$BITRIX_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{
                  "DIALOG_ID": "chat3843",
                  "MESSAGE": "❌ Деплой завершился с ошибкой!\nБранч: '${{ github.ref_name }}'\nКоммит: '${{ github.sha }}'\nАвтор: '${{ github.actor }}'"
                }'
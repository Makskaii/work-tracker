services:
    dev:
      build:
        context: .
        dockerfile: Dockerfile.dev
      ports:
        - "5173:5173"
      volumes:
        - .:/app
        - /app/node_modules
    prod:
      build:
        context: .
        dockerfile: Dockerfile
      ports:
        - "8081:80"
      environment:
        - NODE_ENV=production
      restart: always
